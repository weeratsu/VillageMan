<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>VillageMan</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png?v=5">
<link rel="icon" type="image/png" sizes="64x64" href="images/favicon-64.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png?v=5">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#f5f6f8;--bg2:#fff;--bg3:#f0f1f4;--surface:#e8eaef;--border:#d4d7e0;--border2:#c0c4d0;--text:#1a1d27;--text2:#4a5068;--text3:#7a8098;--primary:#4a7aed;--primary-bg:rgba(74,122,237,.1);--success:#16a34a;--success-bg:rgba(22,163,74,.08);--warning:#d97706;--warning-bg:rgba(217,119,6,.08);--error:#dc2626;--error-bg:rgba(220,38,38,.08);--purple:#7c3aed;--purple-bg:rgba(124,58,237,.08);--radius:8px;--radius-sm:6px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--mono:'SF Mono','Fira Code','Cascadia Code',monospace;--shadow:0 1px 3px rgba(0,0,0,.06)}
html.dark{--bg:#0f1117;--bg2:#1a1d27;--bg3:#252833;--surface:#2a2d3a;--border:#353849;--border2:#454860;--text:#e8eaed;--text2:#9aa0b0;--text3:#6b7185;--primary:#5b8def;--primary-bg:rgba(91,141,239,.12);--success:#4ade80;--success-bg:rgba(74,222,128,.1);--warning:#fbbf24;--warning-bg:rgba(251,191,36,.1);--error:#f87171;--error-bg:rgba(248,113,113,.1);--purple:#a78bfa;--purple-bg:rgba(167,139,250,.1);--shadow:0 1px 3px rgba(0,0,0,.3)}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px}
.layout{display:flex;min-height:100vh}
.sidebar{width:210px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{padding:16px 16px 12px;border-bottom:1px solid var(--border)}
.brand-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
.brand-sub{font-size:10px;color:var(--text3);margin-top:2px}
.nav-items{flex:1;padding:8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 11px;border:none;background:none;border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:var(--font);text-align:left;transition:all .15s}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--primary);color:#fff;font-weight:600;box-shadow:0 1px 4px rgba(74,122,237,.3)}
.nav-item i{width:16px;text-align:center;font-size:12px}
.sidebar-foot{padding:8px;border-top:1px solid var(--border)}
.theme-btn{width:100%;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px;cursor:pointer;color:var(--text2);font-size:11px;display:flex;align-items:center;justify-content:center;gap:5px;font-family:var(--font)}
.theme-btn:hover{background:var(--bg3)}
.content{flex:1;overflow-x:hidden}
.main{max-width:1100px;margin:0 auto;padding:18px}
.tab-content{display:none}.tab-content.active{display:block}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card h2{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;box-shadow:var(--shadow)}
.kpi-label{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)}
.kpi-val{font-size:17px;font-weight:700;font-family:var(--mono);margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{text-align:left;padding:6px;background:var(--bg3);border-bottom:2px solid var(--border);font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);font-weight:600}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:5px 6px;border-bottom:1px solid var(--border)}
.tbl tr:hover{background:rgba(128,128,128,.04)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px;align-items:end}
.form-group{display:flex;flex-direction:column;gap:3px}
.form-group label{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);font-weight:500}
.inp{padding:6px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font);font-size:11px}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-bg)}
.btn{padding:6px 12px;border:none;border-radius:var(--radius-sm);font-size:10px;font-weight:600;cursor:pointer;font-family:var(--font);display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{opacity:.9}
.btn:active{transform:scale(0.96);opacity:.8}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg3)}
.tag{display:inline-block;font-size:8px;padding:2px 6px;border-radius:8px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tag-active{background:var(--success-bg);color:var(--success)}.tag-planned{background:var(--warning-bg);color:var(--warning)}.tag-finished{background:var(--bg3);color:var(--text3)}
.del-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:3px 5px;font-size:11px}.del-btn:hover{color:var(--primary)}
.flex{display:flex}.gap-2{gap:8px}.flex-wrap{flex-wrap:wrap}
.text-success{color:var(--success)}.text-error{color:var(--error)}.text-warning{color:var(--warning)}.text-primary{color:var(--primary)}.text-muted{color:var(--text3)}
.toast{position:fixed;bottom:16px;right:16px;background:var(--success);color:#fff;padding:8px 14px;border-radius:var(--radius-sm);font-size:11px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}.toast.show{opacity:1}
.type-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;font-size:10px}.type-chip .x{cursor:pointer;color:var(--text3);font-size:9px}.type-chip .x:hover{color:var(--error)}
.inp-num{font-family:var(--mono);text-align:right}
@media(max-width:720px){.layout{flex-direction:column}.sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap}.nav-items{flex-direction:row;flex-wrap:wrap}.form-grid{grid-template-columns:1fr}}
  /* Scroll ONLY wide tables (as a block) on narrow screens, not the whole card. */
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  @media(max-width:640px){
    .main{padding:10px}
    .card{padding:10px}
    .tbl{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;font-size:10px}
    .tbl th,.tbl td{padding:4px 5px}
  }
/* ===== MEA-style electricity bill entry (Utilities > Bills) ===== */
:root{--mea:#ea580c}
.mea-bill{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg2);margin-bottom:8px}
.mea-meterpick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--bg3)}
.mea-meterpick label{font-size:10px;font-weight:600;color:var(--text2)}
.mea-meterpick .inp{min-width:220px}
.mea-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--border)}
.mea-hcell{background:var(--bg3);padding:5px 8px;display:flex;flex-direction:column;gap:2px}
.mea-hlabel{font-size:8px;color:var(--text3);text-transform:none;line-height:1.2;min-height:20px}
.mea-in{border:1px solid var(--border);background:var(--bg2);border-radius:4px;padding:3px 6px;font-size:11px;color:var(--text);font-family:var(--font);width:100%}
.mea-in:focus{outline:none;border-color:var(--mea);box-shadow:0 0 0 2px rgba(234,88,12,.15)}
.mea-num{font-family:var(--mono);text-align:right}
.mea-strong{font-weight:700}
.mea-body{display:grid;grid-template-columns:1.3fr 1fr .9fr;gap:10px;padding:10px}
@media(max-width:820px){.mea-body{grid-template-columns:1fr}}
.mea-sec-h{background:var(--mea);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:0}
.mea-desc{border:1px solid var(--border);border-radius:6px;overflow:hidden;padding-bottom:6px}
.mea-drow{display:flex;justify-content:space-between;gap:8px;padding:3px 8px;font-size:11px;align-items:center}
.mea-drow.mea-sub{background:var(--bg3);font-weight:600}
.mea-drow.mea-grand{background:rgba(234,88,12,.1);font-weight:700;font-size:12px;border-top:2px solid var(--mea)}
.mea-inline-amt{max-width:110px}
.mea-tier{border:1px solid var(--border);border-radius:6px;padding:8px}
.mea-center-title{text-align:center;font-size:11px;font-weight:700;color:var(--mea);margin-bottom:6px}
.mea-emode{display:flex;gap:10px;justify-content:center;font-size:10px;margin-bottom:6px}
.mea-emode label{display:flex;align-items:center;gap:3px;cursor:pointer}
.mea-amtbox{display:flex;flex-direction:column;gap:6px}
.mea-amt-due,.mea-amt-total{border:1px solid var(--mea);border-radius:6px;overflow:hidden}
.mea-amt-lbl{background:var(--mea);color:#fff;font-size:9px;padding:3px 8px;line-height:1.3}
.mea-amt-val{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--mea);text-align:right;padding:5px 8px}
.mea-amt-big{font-family:var(--mono);font-weight:800;font-size:20px;color:var(--mea);text-align:right;padding:6px 8px}
.mea-foot{display:flex;gap:10px;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--border);background:var(--bg3)}
.mea-fcell{display:flex;flex-direction:column;gap:2px}
.mea-fcell label{font-size:9px;color:var(--text3);text-transform:none}
.mea-splitcard{border:1px solid var(--mea);border-radius:8px;overflow:hidden;margin-top:4px}
.mea-split-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--border)}
html.dark .mea-drow.mea-grand{background:rgba(234,88,12,.18)}
/* meter dropdown + any select in the bill: make it clearly interactive (not greyed) */
.mea-meterpick select.inp,select.mea-in{-webkit-appearance:none;appearance:none;cursor:pointer;background-color:var(--bg2);color:var(--text);border:1px solid var(--border2);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 3l3 3 3-3' stroke='%23888' stroke-width='1.5' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 8px center;padding-right:24px}
.mea-meterpick select.inp:hover,select.mea-in:hover{border-color:var(--primary)}
.mea-meterpick select.inp:focus,select.mea-in:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-bg)}
/* ===== Water (MWA) blue theme — applied when .mea-bill has .mea-bill-water ===== */
:root{--mwa:#0ea5e9}
.mea-sec-water{background:var(--mwa)}
.mea-water-desc{border-color:var(--mwa)}
.mea-drow.mea-grand-water{background:rgba(14,165,233,.12);border-top:2px solid var(--mwa)}
html.dark .mea-drow.mea-grand-water{background:rgba(14,165,233,.2)}
.mea-bill-water .mea-amt-lbl{background:var(--mwa)}
.mea-bill-water .mea-amt-val,.mea-bill-water .mea-amt-big,.mea-bill-water .mea-center-title{color:var(--mwa)}
.mea-bill-water .mea-amt-due,.mea-bill-water .mea-amt-total{border-color:var(--mwa)}
.mea-bill-water .mea-in:focus{border-color:var(--mwa);box-shadow:0 0 0 2px rgba(14,165,233,.15)}
/* link-style button used for the split-bill expand chevron */
.lnk-btn{background:none;border:none;cursor:pointer;color:var(--primary);padding:2px 4px;font-size:12px;border-radius:4px}
.lnk-btn:hover{background:var(--primary-bg)}
tr.bill-detail td{border-top:none}
</style>
<style id="vm-mobile">
/* ===== Phone layout (Oct 8 2026): compact top bar + bottom tab menu (like CashMan). PC (>720px) unchanged. ===== */
@media(max-width:720px){
  .layout{display:block!important;min-height:0}
  .sidebar{position:sticky!important;top:0;z-index:50;width:100%!important;height:auto!important;flex-direction:row!important;
           flex-wrap:nowrap!important;align-items:center;border-right:none;border-bottom:1px solid var(--border);padding:0 8px}
  .brand{flex:1;min-width:0;padding:8px 4px!important;border-bottom:none!important}
  .brand-title{font-size:14px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-sub{display:none}
  #sb-today{display:none!important}
  .sidebar-foot{border-top:none!important;padding:0!important;flex:none}
  .theme-btn{width:auto!important;padding:6px 10px!important}
  .nav-items{position:fixed!important;left:0;right:0;bottom:0;z-index:60;flex-direction:row!important;flex-wrap:nowrap!important;
             overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;gap:0!important;padding:4px 4px calc(4px + env(safe-area-inset-bottom))!important;
             background:var(--bg2);border-top:1px solid var(--border);box-shadow:0 -2px 8px rgba(0,0,0,.06)}
  .nav-item{flex:0 0 auto;flex-direction:column!important;gap:3px!important;min-width:68px;max-width:84px;padding:6px 4px!important;
            font-size:10px!important;text-align:center;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-item i{font-size:16px}
  .content{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  #cm-sync-badge{bottom:calc(70px + env(safe-area-inset-bottom))!important}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title"><i class="fa-solid fa-city" style="color:var(--primary)"></i> <span id="brand-estate">VillageMan</span></div>
      <div class="brand-sub">VillageMan</div>
    </div>
    <div id="sb-today" style="font-size:10.5px;color:var(--text2);padding:6px 10px;margin:10px 12px 4px;background:var(--bg);border:1px solid var(--border);border-radius:8px;white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:6px" title="Today's date"><i class="fa-solid fa-calendar-day" style="color:var(--primary)"></i> <span class="sb-today-txt"></span></div>
    <nav class="nav-items">
      <button class="nav-item active" data-tab="dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</button>
      <button class="nav-item" data-tab="finance"><i class="fa-solid fa-coins"></i> Finance</button>
      <button class="nav-item" data-tab="utilities"><i class="fa-solid fa-bolt"></i> Utilities</button>
      <button class="nav-item" data-tab="pubreport"><i class="fa-solid fa-users"></i> สรุปส่วนกลาง</button>
      <button class="nav-item" data-tab="households"><i class="fa-solid fa-house-user"></i> Households</button>
      <button class="nav-item" data-tab="vendors"><i class="fa-solid fa-screwdriver-wrench"></i> Vendors</button>
      <button class="nav-item" data-tab="emergency"><i class="fa-solid fa-kit-medical"></i> Emergency</button>
      <button class="nav-item" data-tab="settings"><i class="fa-solid fa-gear"></i> Settings</button>
    </nav>
    <div class="sidebar-foot">
      <button class="theme-btn" id="theme-toggle"><i class="fa-solid fa-moon"></i> Dark</button>
    </div>
  </aside>
  <div class="content">
    <div class="main">
      <div id="toast" class="toast"></div>
      <div id="tab-dashboard" class="tab-content active"></div>
      <div id="tab-finance" class="tab-content"></div>
      <div id="tab-utilities" class="tab-content"></div>
      <div id="tab-pubreport" class="tab-content"></div>
      <div id="tab-households" class="tab-content"></div>
      <div id="tab-vendors" class="tab-content"></div>
      <div id="tab-emergency" class="tab-content"></div>
      <div id="tab-settings" class="tab-content"></div>
    </div>
  </div>
</div>

<!-- QR library for PromptPay - loaded with an error guard so a CDN failure can NEVER break the app.
     If it fails to load (offline), the payment panel falls back to showing the PromptPay ID + amount as text. -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" onerror="window.__QR_CDN_FAILED__=true;"></script>

<!-- App modules - order matters: data/util/repo first, then features, then app boot. Cache-busted. -->
<script>
/* Dynamic loader: loads each module in dependency order with a fresh cache-busting
   token every page load, so edits always show even under file:// (where ?v= is
   often ignored and the browser caches JS hard). No more manual version bumping. */
(function(){
  var files = ['data','util','config-sheet','repo','repo-sheet','promptpay','ui-dashboard','ui-households',
               'ui-finance','ui-utilities','ui-pubreport','drive-view','ui-vendors','ui-emergency','app','pull-refresh'];
  var bust = Date.now();               // unique per load -> always bypasses cache
  // Load the shared UtilityLog data (home MEA/MWA bills) from CashMan's data folder first,
  // so window.UTILITY_DATA is available for the Bills auto-fill. Optional: continue if missing.
  (function(){
    var u=document.createElement('script');
    u.src='../CashMan/data/utility_log.js?t='+bust;
    u.onerror=function(){ window.UTILITY_DATA=window.UTILITY_DATA||{bills:[]}; };
    document.head.appendChild(u);
  })();
  // Load the meter-photo index (written by organize_meter_photos.py) so the report can resolve
  // dated photo filenames (<meterNo>_<period>_<YYYY-MM-DD>.jpg). Optional: continue if missing.
  (function(){
    var pi=document.createElement('script');
    pi.src='meter-photos/photo_index.js?t='+bust;
    pi.onerror=function(){ window.VM_PHOTO_INDEX=window.VM_PHOTO_INDEX||null; };
    document.head.appendChild(pi);
  })();
  function loadNext(i){
    if(i >= files.length) return;
    var s = document.createElement('script');
    s.src = 'js/' + files[i] + '.js?t=' + bust;
    s.onload = function(){ loadNext(i+1); };
    s.onerror = function(){
      if(files[i]==='config-sheet'){ loadNext(i+1); return; }   // optional (not on GitHub Pages) -> repo-sheet uses browser-saved connection
      document.body.insertAdjacentHTML('afterbegin',
        '<div style="background:#b91c1c;color:#fff;padding:10px;font:13px sans-serif">'
        + 'Failed to load js/' + files[i] + '.js — check the file exists.</div>');
    };
    document.head.appendChild(s);      // sequential load preserves dependency order
  }
  loadNext(0);
})();
</script>
</body>
</html>
