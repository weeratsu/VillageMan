<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VillageMan - Connect to Google Sheet</title>
<style>body{font:15px system-ui,"Segoe UI",Tahoma,sans-serif;max-width:560px;margin:20px auto;padding:0 14px;color:#1f2937}
h2{margin:6px 0}.card{border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin:12px 0}
label{display:block;font-size:13px;color:#475569;margin-top:8px}input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #cbd5e1;border-radius:6px;font:13px monospace}
button{padding:8px 14px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;margin:8px 6px 0 0}
.pri{background:#2563eb;color:#fff;border-color:#2563eb}.ok{color:#15803d;font-weight:600}.bad{color:#b91c1c;font-weight:600}
.warn{background:#fef3c7;border-color:#f59e0b;font-size:13px}#qr{margin:10px 0}#qr img,#qr canvas{max-width:240px}</style></head><body>
<h2>🔗 VillageMan → Google Sheet</h2>
<div id="st" class="card"></div>

<div id="pcbox" class="card" style="display:none">
<b>📱 เชื่อมมือถือ / เว็บ GitHub</b>
<div style="font-size:13px;color:#475569">ใช้กล้องมือถือสแกน QR นี้ แล้วเปิดลิงก์ที่ขึ้นมา มือถือจะเชื่อมกับ Sheet ให้อัตโนมัติ</div>
<div id="qr"></div>
<button onclick="copyLink()">Copy link (สำหรับเปิดเว็บบน PC)</button>
<div class="card warn">⚠️ QR และลิงก์นี้มี write token อยู่ข้างใน ห้ามส่งหรือแคปให้คนอื่น</div>
</div>

<div class="card"><b>ตั้งค่าเอง</b>
<label>Endpoint (/exec URL)</label><input id="e">
<label>Write token</label><input id="w" type="password">
<label>Read token (ไม่ใส่ก็ได้)</label><input id="r" type="password">
<button class="pri" onclick="save()">Save & Test</button>
<button onclick="disc()">Disconnect browser นี้</button>
</div>
<div><a href="index.html">← กลับไปที่ VillageMan</a></div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
var KEY='vm_sheet_cfg', PAGES='https://weeratsu.github.io/VillageMan/';
function get(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ return null; } }
function st(html){ document.getElementById('st').innerHTML=html; }
function show(){
  var c=get(), local=window.__CFG && window.__CFG.endpoint;
  if(local) st('<span class="ok">✅ เครื่องนี้ใช้ไฟล์ config-sheet.js ในเครื่อง</span><br><small>ไม่ต้องตั้งค่าในหน้านี้ ใช้หน้านี้สร้าง QR ให้มือถือได้</small>');
  else if(c&&c.endpoint) st('<span class="ok">✅ browser นี้เชื่อมกับ Sheet แล้ว</span><br><small>'+c.endpoint.slice(0,60)+'…</small>');
  else st('<span class="bad">❌ browser นี้ยังไม่เชื่อมกับ Sheet</span><br><small>สแกน QR จาก PC หรือกรอกค่าด้านล่าง</small>');
  var f=c||window.__CFG||{}; document.getElementById('e').value=f.endpoint||''; document.getElementById('w').value=f.writeToken||''; document.getElementById('r').value=f.readToken||'';
}
function link(c){ return PAGES+'connect.html#e='+encodeURIComponent(c.endpoint)+'&w='+encodeURIComponent(c.writeToken)+'&r='+encodeURIComponent(c.readToken||''); }
function copyLink(){ var l=link(window.__CFG); (navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(function(){alert('Copied');},function(){prompt('Copy:',l);}); }
function test(c){
  st('↻ กำลังทดสอบ… (ครั้งแรกอาจใช้ 20–40 วินาที)');
  return fetch(c.endpoint+'?action=all&'+'token='+encodeURIComponent(c.readToken||c.writeToken)+'&t='+Date.now())
   .then(function(r){return r.json();}).then(function(j){
     if(j&&j.ok){ st('<span class="ok">✅ เชื่อมสำเร็จ</span> — <a href="index.html">เปิด VillageMan</a>'); }
     else st('<span class="bad">❌ '+((j&&j.error)||'error')+'</span>');
   }).catch(function(e){ st('<span class="bad">❌ ต่อไม่ได้: '+e+'</span>'); });
}
function save(){
  var c={endpoint:document.getElementById('e').value.trim(),writeToken:document.getElementById('w').value.trim(),readToken:document.getElementById('r').value.trim()};
  if(c.endpoint.indexOf('https://script.google.com/')!==0||!c.writeToken){ alert('ต้องมี endpoint (https://script.google.com/...) และ write token'); return; }
  localStorage.setItem(KEY,JSON.stringify(c)); test(c);
}
function disc(){ if(confirm('ยกเลิกการเชื่อม Sheet ใน browser นี้?')){ localStorage.removeItem(KEY); show(); } }
// 1) link from QR: #e=..&w=..&r=..
(function(){
  var h=location.hash.slice(1); if(!h) return;
  var p={}; h.split('&').forEach(function(kv){ var i=kv.indexOf('='); if(i>0) p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1)); });
  history.replaceState(null,'',location.pathname);           // remove token from address bar/history
  if(p.e&&p.w){ var c={endpoint:p.e,writeToken:p.w,readToken:p.r||''}; localStorage.setItem(KEY,JSON.stringify(c)); window.__fromLink=c; }
})();
</script>
<script src="js/config-sheet.js" onerror="void 0"></script>
<script>
window.__CFG = (window.CM_SHEET_CFG&&window.CM_SHEET_CFG.endpoint) ? window.CM_SHEET_CFG : null;
show();
if(window.__CFG){ document.getElementById('pcbox').style.display='';
  try{ new QRCode(document.getElementById('qr'),{text:link(window.__CFG),width:240,height:240,correctLevel:QRCode.CorrectLevel.L}); }catch(e){ document.getElementById('qr').textContent='QR library failed to load — use Copy link'; } }
if(window.__fromLink) test(window.__fromLink);
</script></body></html>
